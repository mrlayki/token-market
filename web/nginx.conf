# 80：用户端 + 公开站 + OpenAI/Anthropic 兼容 API（/v1）
# 81：管理端（生产环境建议仅内网 / VPN 可访问）

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# 用 Docker 内置 DNS 动态解析：api / relay 容器重建后 IP 变化，无需重启 Nginx
resolver 127.0.0.11 valid=10s ipv6=off;
upstream tm_api   { zone tm_api 64k;   server api:8000 resolve;   keepalive 32; }
upstream tm_relay { zone tm_relay 64k; server relay:8001 resolve; keepalive 256; }

server {
  listen 80;
  server_name _;
  client_max_body_size 50m;
  root /usr/share/nginx/console;

  location /v1/ {
    proxy_pass http://tm_relay;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 流式响应：关闭缓冲，长超时
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
  }

  location /api/admin/ { return 404; }

  location /api/ {
    proxy_pass http://tm_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 900s;
  }

  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  # index.html 不缓存：发版后浏览器立即拿到新的分包文件名；带哈希的 /assets 长期缓存
  location = /index.html { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}

server {
  listen 81;
  server_name _;
  client_max_body_size 20m;
  root /usr/share/nginx/admin;

  location /api/ {
    proxy_pass http://tm_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
  }

  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  # index.html 不缓存：发版后浏览器立即拿到新的分包文件名；带哈希的 /assets 长期缓存
  location = /index.html { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
